[package]
name = "deckprep-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
font8x8 = "0.3.1"
sdl2 = { version = "0.38.0", features = ["use-pkgconfig"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
